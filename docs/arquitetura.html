<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Arquitetura</title>
<style>
body { margin:0; background:#fcfcfb; font-family:"Helvetica Neue",Arial,sans-serif; color:#0b0b0b; }
svg text { font-family:"Helvetica Neue",Arial,sans-serif; }
</style></head><body>
<svg width="1400" height="760" viewBox="0 0 1400 760" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52514e"/>
    </marker>
  </defs>
  <text x="30" y="44" font-size="24" font-weight="700">Pipeline Medallion: energia solar distribuída no Brasil</text>
  <text x="30" y="72" font-size="15" fill="#52514e">8 fontes públicas, processamento local em Python/DuckDB e reprocessamento distribuído em Databricks (PySpark + Delta Lake)</text>

  <rect x="30" y="100" width="230" height="400" rx="12" fill="#f4f4f1" stroke="#c3c2b7"/>
  <text x="50" y="130" font-size="15" font-weight="700">Fontes públicas</text>
  <g font-size="13">
    <rect x="48" y="146" width="194" height="58" rx="8" fill="#fff" stroke="#e1e0d9"/>
    <text x="60" y="170" font-weight="700">ANEEL</text><text x="60" y="190" fill="#52514e">4,7 mi instalações de GD</text>
    <rect x="48" y="214" width="194" height="58" rx="8" fill="#fff" stroke="#e1e0d9"/>
    <text x="60" y="238" font-weight="700">ANEEL</text><text x="60" y="258" fill="#52514e">tarifas homologadas</text>
    <rect x="48" y="282" width="194" height="58" rx="8" fill="#fff" stroke="#e1e0d9"/>
    <text x="60" y="306" font-weight="700">INPE / LABREN</text><text x="60" y="326" fill="#52514e">Atlas Solar por município</text>
    <rect x="48" y="350" width="194" height="76" rx="8" fill="#fff" stroke="#e1e0d9"/>
    <text x="60" y="374" font-weight="700">IBGE (API SIDRA)</text><text x="60" y="394" fill="#52514e">população, domicílios,</text><text x="60" y="412" fill="#52514e">apartamentos, PIB</text>
    <rect x="48" y="436" width="194" height="52" rx="8" fill="#fff" stroke="#e1e0d9"/>
    <text x="60" y="458" font-weight="700">IBGE Localidades</text><text x="60" y="476" fill="#52514e">UF e regiões</text>
  </g>

  <rect x="300" y="100" width="790" height="400" rx="12" fill="none" stroke="#c3c2b7" stroke-dasharray="6 5"/>
  <text x="320" y="130" font-size="15" font-weight="700">Pipeline local · Python 3.12 + DuckDB + Parquet</text>

  <rect x="320" y="150" width="230" height="330" rx="10" fill="#fbf1ea" stroke="#a0522d"/>
  <text x="336" y="178" font-size="17" font-weight="700" fill="#8b4513">Bronze</text>
  <g font-size="13" fill="#3b2a1e">
    <text x="336" y="206">bronze.py</text>
    <text x="336" y="232">• cópia fiel em Parquet (zstd)</text>
    <text x="336" y="254">• _fonte, _ingerido_em,</text>
    <text x="350" y="272">_sha256_origem</text>
    <text x="336" y="294">• manifesto JSON por carga</text>
    <text x="336" y="316">• remove CPF/CNPJ, nome</text>
    <text x="350" y="334">e CEP (LGPD)</text>
    <text x="336" y="356">• idempotente: não baixa</text>
    <text x="350" y="374">de novo o que já existe</text>
  </g>

  <rect x="580" y="150" width="230" height="330" rx="10" fill="#f4f6f7" stroke="#8a939b"/>
  <text x="596" y="178" font-size="17" font-weight="700" fill="#5d6770">Silver</text>
  <g font-size="13" fill="#2b3036">
    <text x="596" y="206">silver.py</text>
    <text x="596" y="232">• só usinas solares (UFV)</text>
    <text x="596" y="254">• tipagem e categorias</text>
    <text x="596" y="276">• dedup por empreendimento</text>
    <text x="596" y="298">• datas sentinela → nulo</text>
    <text x="596" y="320">• IBGE pivotado por código</text>
    <text x="596" y="342">• INPE por nome + UF:</text>
    <text x="610" y="360">exato, exceções e fuzzy</text>
    <text x="596" y="382">• tarifa B1 da distribuidora</text>
    <text x="596" y="404">• _qualidade.json</text>
  </g>

  <rect x="840" y="150" width="230" height="330" rx="10" fill="#fff9e6" stroke="#c9a227"/>
  <text x="856" y="178" font-size="17" font-weight="700" fill="#9a7b0a">Gold</text>
  <g font-size="13" fill="#3a3005">
    <text x="856" y="206">gold.py · analise.py</text>
    <text x="856" y="232">• municipios (5.570)</text>
    <text x="856" y="254">• serie_mensal</text>
    <text x="856" y="276">• ufs (27)</text>
    <text x="856" y="298">• corte automático do atraso</text>
    <text x="870" y="316">de registro da ANEEL</text>
    <text x="856" y="338">• lacuna_adocao (ML)</text>
    <text x="856" y="360">• clusters (KMeans)</text>
    <text x="856" y="382">• _checagens.json</text>
  </g>

  <rect x="1130" y="150" width="240" height="330" rx="12" fill="#f4f4f1" stroke="#c3c2b7"/>
  <text x="1150" y="180" font-size="15" font-weight="700">Consumo</text>
  <g font-size="13">
    <rect x="1148" y="196" width="204" height="56" rx="8" fill="#fff" stroke="#e1e0d9"/>
    <text x="1160" y="220" font-weight="700">Dashboard HTML</text><text x="1160" y="240" fill="#52514e">Plotly, interativo</text>
    <rect x="1148" y="262" width="204" height="56" rx="8" fill="#fff" stroke="#e1e0d9"/>
    <text x="1160" y="286" font-weight="700">Gráficos e análises</text><text x="1160" y="306" fill="#52514e">graficos.py</text>
    <rect x="1148" y="328" width="204" height="56" rx="8" fill="#fff" stroke="#e1e0d9"/>
    <text x="1160" y="352" font-weight="700">Relatório executivo</text><text x="1160" y="372" fill="#52514e">recomendações</text>
    <rect x="1148" y="394" width="204" height="56" rx="8" fill="#fff" stroke="#e1e0d9"/>
    <text x="1160" y="418" font-weight="700">Gestores públicos</text><text x="1160" y="438" fill="#52514e">MME, ANEEL, estados</text>
  </g>

  <g stroke="#52514e" stroke-width="1.6" fill="none" marker-end="url(#seta)">
    <path d="M260 300 L318 300"/>
    <path d="M550 315 L578 315"/>
    <path d="M810 315 L838 315"/>
    <path d="M1070 315 L1128 315"/>
  </g>
  <text x="264" y="292" font-size="12" fill="#52514e">HTTP</text>

  <rect x="300" y="540" width="1070" height="190" rx="12" fill="#fff5f3" stroke="#ff3621"/>
  <text x="320" y="572" font-size="15" font-weight="700" fill="#c42a18">Databricks Free Edition · Unity Catalog · serverless</text>
  <g font-size="13">
    <rect x="320" y="590" width="230" height="120" rx="8" fill="#fff" stroke="#f3c3bb"/>
    <text x="336" y="614" font-weight="700">Volume raw</text><text x="336" y="636" fill="#52514e">download direto das fontes</text><text x="336" y="656" fill="#52514e">requests + zipfile</text>
    <rect x="580" y="590" width="230" height="120" rx="8" fill="#fff" stroke="#f3c3bb"/>
    <text x="596" y="614" font-weight="700">Delta bronze_*</text><text x="596" y="636" fill="#52514e">spark.read parquet/csv/json</text><text x="596" y="656" fill="#52514e">_metadata.file_path</text>
    <rect x="840" y="590" width="230" height="120" rx="8" fill="#fff" stroke="#f3c3bb"/>
    <text x="856" y="614" font-weight="700">Delta silver_*</text><text x="856" y="636" fill="#52514e">Window, create_map, pivot,</text><text x="856" y="656" fill="#52514e">levenshtein, joins</text>
    <rect x="1100" y="590" width="250" height="120" rx="8" fill="#fff" stroke="#f3c3bb"/>
    <text x="1116" y="614" font-weight="700">Delta gold_*</text><text x="1116" y="636" fill="#52514e">Spark SQL (FILTER, GROUP BY ALL)</text><text x="1116" y="656" fill="#52514e">conferência com o local</text>
  </g>
  <g stroke="#c42a18" stroke-width="1.6" fill="none" marker-end="url(#seta)">
    <path d="M550 650 L578 650"/>
    <path d="M810 650 L838 650"/>
    <path d="M1070 650 L1098 650"/>
    <path d="M145 500 L145 650 L318 650"/>
  </g>
  <text x="160" y="640" font-size="12" fill="#c42a18">mesmas URLs</text>
</svg>
</body></html>
